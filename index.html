<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>⠀</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#app">Bỏ qua tới nội dung</a>
  <div class="shell">
    <!-- Thanh điều hướng: cột icon kèm nhãn (desktop) / thanh tab dưới (điện thoại). 5 mục theo luồng học: bài học, từ vựng, chữ viết, luyện thi, cài đặt -->
    <header class="rail">
      <nav aria-label="Điều hướng chính">
        <a href="#/lessons" data-route="learn" aria-label="Bài học" title="Bài học và Bài tập: 25 bài của giáo trình">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.5 4.7 7.6 4 4 4v14c3.6 0 6.5.7 8 2.5 1.5-1.8 4.4-2.5 8-2.5V4c-3.6 0-6.5.7-8 2.5z"/><path d="M12 6.5v14"/></svg>
          <span class="nav-label">Bài học</span>
        </a>
        <a href="#/flash" data-route="words" aria-label="Từ vựng" title="Từ vựng: thẻ flash, gõ romaji, tra từ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M6 4.5h12"/><path d="M8 13h8M8 16h5"/></svg>
          <span class="nav-label">Từ vựng</span>
        </a>
        <a href="#/kana" data-route="write" aria-label="Chữ viết" title="Chữ viết: Kana và 80 chữ Kanji">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M13.5 7.5l3 3"/></svg>
          <span class="nav-label">Chữ viết</span>
        </a>
        <a href="#/exams" data-route="test" aria-label="Luyện thi" title="Luyện thi: thi thử N5 và sổ lỗi sai">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 14l2 2 4-4"/></svg>
          <span class="nav-label">Luyện thi</span>
          <span class="nav-badge" id="nb-badge" hidden></span>
        </a>
        <a href="#/data" data-route="data" aria-label="Cài đặt" title="Cài đặt và dữ liệu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
          <span class="nav-label">Cài đặt</span>
        </a>
      </nav>
    </header>
    <main id="app" tabindex="-1"></main>
  </div>
  <noscript><p class="error">Ứng dụng cần bật JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
